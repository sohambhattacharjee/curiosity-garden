name: CI
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  core-tests:
    name: Core tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/tests
      - run: bash scripts/test_coverage.sh
  ios-build:
    name: iOS build
    runs-on: macos-15
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project CuriosityGarden.xcodeproj -scheme CuriosityGarden -configuration ${{ matrix.configuration }} -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
